apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - "-target=all"
            - "-auth.enabled=false"
            - "-server.http-listen-port=3100"
            - "-server.grpc-listen-port=9095"
            - "-common.storage.backend=filesystem"
            - "-common.storage.filesystem.chunks-directory=/tmp/loki/chunks"
            - "-common.storage.filesystem.rules-directory=/tmp/loki/rules"
            - "-schema.config.configs[0].from=2024-01-01"
            - "-schema.config.configs[0].store=tsdb"
            - "-schema.config.configs[0].object_store=filesystem"
            - "-schema.config.configs[0].schema=v13"
            - "-schema.config.configs[0].index.prefix=index_"
            - "-schema.config.configs[0].index.period=24h"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9095
              name: grpc
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: http
      name: http
    - port: 9095
      targetPort: grpc
      name: grpc
  selector:
    app: loki