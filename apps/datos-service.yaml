apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datos-service
  namespace: argocd
  labels:
    app: datos-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AJCG03/gitops-sa-p6-202201130.git
    targetRevision: main
    path: charts/datos-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p6
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        - /status
        - /metadata/annotations
        - /spec/template/spec/containers/0/ports
      managedFieldsManagers:
        - argoproj.io/rollouts-controller
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /spec/selector
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true