apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    # Sync-wave 1: después de Prometheus, antes de las reglas de SLO
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: sa-p6-observability
spec:
  project: default
  sources:
    # ─────────────────────────────────────────────
    # Source 1: el chart Helm externo de Grafana
    # ─────────────────────────────────────────────
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.6.4
      helm:
        valueFiles:
          - $values/charts/observability/values-loki.yaml
    # ─────────────────────────────────────────────
    # Source 2: tu repo GitOps (referencia para $values)
    # ─────────────────────────────────────────────
    - repoURL: https://github.com/AJCG03/gitops-sa-p6-202201130.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m