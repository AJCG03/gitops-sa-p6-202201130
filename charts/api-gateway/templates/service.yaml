# Service estable (recibe tráfico de usuarios)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: stable
spec:
  type: {{ .Values.api_gateway.service.type | default "LoadBalancer" }}
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
---
# Service canary (recibe tráfico de prueba)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: canary
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
---
# Service principal (compatibilidad con lo que ya tienes desplegado)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
spec:
  type: {{ .Values.api_gateway.service.type | default "LoadBalancer" }}
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api-gateway