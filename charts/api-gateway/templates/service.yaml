# Service estable
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: stable
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
---
# Service canary
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: canary
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway