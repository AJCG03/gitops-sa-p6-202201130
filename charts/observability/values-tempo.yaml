# ═══════════════════════════════════════════════════════════════════
# Values para el chart oficial de Tempo (grafana/tempo)
# Modo monolithic — 1 solo pod
# Optimizado para GKE con nodos e2-standard-2
# ═══════════════════════════════════════════════════════════════════

tempo:
  mode: "monolithic"

  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

  retention: 24h

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce

  # ⚠️ El chart grafana/tempo NO lee 'service.ports'.
  # Los puertos del Service se definen aquí, usando las claves que
  # el chart SÍ reconoce.
  service:
    type: ClusterIP
    port: 3200
    targetPort: 3200

  # ⚠️ El receptor OTLP se define en 'receivers' (no en 'config').
  # El chart usa esta clave para crear el Service con puerto 4317.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  config: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 30s
      max_block_bytes: 1073741824
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    overrides:
      max_bytes_per_trace: 5000000

# ⚠️ ADICIONAL: crear un Service extra manualmente para asegurar
# que el puerto OTLP gRPC (4317) esté expuesto a OTel.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: tempo-otlp
      namespace: observability
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: sa-p6-observability
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: tempo
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

traces:
  jaeger:
    enabled: false
  zipkin:
    enabled: false