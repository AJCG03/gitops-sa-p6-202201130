# ═══════════════════════════════════════════════════════════════════
# Values para el chart oficial de Tempo (grafana/tempo) — CORREGIDO
# Modo monolithic — 1 solo pod
# Optimizado para GKE con límite de memoria ajustado para evitar OOMKilled
# ═══════════════════════════════════════════════════════════════════

tempo:
  mode: "monolithic"

  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 384Mi   # ⬅️ Aumentado de 192Mi a 384Mi para evitar OOMKilled (Exit Code 137)

  # ⬇️ Solución al consumo masivo de memoria que causaba los reinicios
  extraArgs:
    - -mem-ballast-size-mbs=32

  retention: 24h

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP
    port: 3200
    targetPort: 3200

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  config: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 30s
      max_block_bytes: 1073741824
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

    overrides:
      max_bytes_per_trace: 5000000

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: tempo-otlp
      namespace: observability
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: sa-p6-observability
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: tempo
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

traces:
  jaeger:
    enabled: false
  zipkin:
    enabled: false