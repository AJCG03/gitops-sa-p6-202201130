tempo:
  mode: "monolithic"

  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

  retention: 24h

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP
    httpPort: 3200
    grpcPort: 9095
    otlpGrpcPort: 4317
    otlpHttpPort: 4318

  config: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 30s
      max_block_bytes: 1073741824
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    overrides:
      max_bytes_per_trace: 5000000

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

traces:
  jaeger:
    enabled: false
  zipkin:
    enabled: false