apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: sa-p6-alertmanager-config
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: sa-p6-observability
spec:
  route:
    groupBy:
      - service
      - slo
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: "null"
    routes:
      - match:
          severity: warning
        receiver: "null"
        continue: true

  inhibitRules:
    - sourceMatch:
        - name: slo
          value: datos-latency
          matchType: "="
      targetMatch:
        - name: slo
          value: datos-latency
          matchType: "="
      equal:
        - service

  receivers:
    # "null" receiver: no envía nada, pero Alertmanager loguea en stdout
    - name: "null"