apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sa-p6-slo-rules
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: sa-p6-observability
spec:
  groups:
    - name: slo-sensores-availability
      interval: 30s
      rules:
        # SLI: ratio de requests exitosos (no-5xx) en 5m
        - record: sli:sensores_availability:ratio5m
          expr: |
            sum(rate(http_requests_total{service="sensores-service",status!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="sensores-service"}[5m]))

        # Presupuesto consumido en ventana de 30d (usando increase con subquery)
        # SLO: 99.9% → presupuesto 0.1% = 0.001
        - record: slo:sensores_availability:budget_consumed30d
          expr: |
            (
              1 - (
                sum(increase(http_requests_total{service="sensores-service",status!~"5.."}[30d]))
                /
                sum(increase(http_requests_total{service="sensores-service"}[30d]))
              )
            ) / 0.001

        # Burn rate a corto plazo (para alertas rápidas)
        - record: slo:sensores_availability:burn_rate5m
          expr: |
            (1 - sli:sensores_availability:ratio5m) / 0.001

    - name: slo-datos-latency
      interval: 30s
      rules:
        # SLI: p99 de latencia en 5m
        - record: sli:datos_latency_p99:seconds5m
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{service="datos-service",method="GET"}[5m])) by (le)
            )

        # Presupuesto consumido en ventana de 7d
        # SLO: 99% de requests < 250ms → presupuesto 1% = 0.01
        - record: slo:datos_latency:budget_consumed7d
          expr: |
            (
              1 - (
                sum(increase(http_request_duration_seconds_bucket{service="datos-service",method="GET",le="0.25"}[7d]))
                /
                sum(increase(http_request_duration_seconds_count{service="datos-service",method="GET"}[7d]))
              )
            ) / 0.01

        # Burn rate a corto plazo
        - record: slo:datos_latency:burn_rate5m
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{service="datos-service",method="GET"}[5m]))
              -
              sum(rate(http_request_duration_seconds_bucket{service="datos-service",method="GET",le="0.25"}[5m]))
            )
            /
            sum(rate(http_request_duration_seconds_count{service="datos-service",method="GET"}[5m]))
            / 0.01