# ═══════════════════════════════════════════════════════════════════
# PrometheusRule: SLOs del sistema sa-p6
# ═══════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sa-p6-slo-rules
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: sa-p6-observability
spec:
  groups:
    # ═══════════════════════════════════════════════════════════════
    # SLO-01: DISPONIBILIDAD DE SENSORES-SERVICE
    # ═══════════════════════════════════════════════════════════════
    - name: slo-sensores-availability
      interval: 30s
      rules:
        - record: sli:sensores_availability:ratio5m
          expr: |
            sum(rate(gateway_requests_total{exported_service="sensores-service",status!~"5.."}[5m]))
            /
            sum(rate(gateway_requests_total{exported_service="sensores-service"}[5m]))
            or vector(0)

        - record: slo:sensores_availability:budget_consumed30d
          expr: |
            (
              1 - (
                sum(increase(gateway_requests_total{exported_service="sensores-service",status!~"5.."}[30d]))
                /
                sum(increase(gateway_requests_total{exported_service="sensores-service"}[30d]))
              )
            ) / 0.001
            or vector(0)

        - record: slo:sensores_availability:burn_rate5m
          expr: |
            (1 - sli:sensores_availability:ratio5m) / 0.001

    # ═══════════════════════════════════════════════════════════════
    # SLO-02: LATENCIA p99 DE DATOS-SERVICE
    # ═══════════════════════════════════════════════════════════════
    - name: slo-datos-latency
      interval: 30s
      rules:
        - record: sli:datos_latency_p99:seconds5m
          expr: |
            histogram_quantile(0.99,
              sum(rate(gateway_request_duration_seconds_bucket{exported_service="datos-service"}[5m])) by (le)
            )
            or vector(0)

        - record: slo:datos_latency:budget_consumed7d
          expr: |
            (
              1 - (
                sum(increase(gateway_request_duration_seconds_bucket{exported_service="datos-service",le="0.25"}[7d]))
                /
                sum(increase(gateway_request_duration_seconds_count{exported_service="datos-service"}[7d]))
              )
            ) / 0.01
            or vector(0)

        - record: slo:datos_latency:burn_rate5m
          expr: |
            (
              sum(rate(gateway_request_duration_seconds_count{exported_service="datos-service"}[5m]))
              -
              sum(rate(gateway_request_duration_seconds_bucket{exported_service="datos-service",le="0.25"}[5m]))
            )
            /
            sum(rate(gateway_request_duration_seconds_count{exported_service="datos-service"}[5m]))
            / 0.01