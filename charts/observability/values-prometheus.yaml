# ═══════════════════════════════════════════════════════════════════
# Values para kube-prometheus-stack - Ultra Minimizado para GKE e2-small
# ═══════════════════════════════════════════════════════════════════

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: "2GB"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    scrapeInterval: 60s
    evaluationInterval: 60s
    externalLabels:
      cluster: practica6-cluster
      region: us-central1

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  alertmanagerConfigSelector:
    matchLabels:
      release: kube-prometheus-stack
  alertmanagerConfigNamespaceSelector:
    matchNames:
      - observability

grafana:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    enabled: true
    patch:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 25m
          memory: 32Mi

thanosRuler:
  enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeProxy: false
    kubeApiserverSlos: false