# ═══════════════════════════════════════════════════════════════════
# Values para kube-prometheus-stack — Optimizado para e2-standard-2
# ═══════════════════════════════════════════════════════════════════

# Desactivar exporters que no necesitas (ahorra varios pods)
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

# ─────────────────────────────────────────────
# Prometheus
# ─────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: "2GB"
    # ⚠️ FIX P10: Prometheus se OOMKilleaba con 384Mi.
    # Subimos a 768Mi para que pueda recuperar la WAL y operar.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
    walCompression: true
    query:
      maxSamples: 50000000
      timeout: 2m
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    scrapeInterval: 60s
    evaluationInterval: 60s
    externalLabels:
      cluster: practica6-cluster
      region: us-central1

# ─────────────────────────────────────────────
# Alertmanager
# ─────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  alertmanagerConfigSelector:
    matchLabels:
      release: kube-prometheus-stack
  alertmanagerConfigNamespaceSelector:
    matchNames:
      - observability

# ─────────────────────────────────────────────
# Grafana
# ─────────────────────────────────────────────
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "MiPasswordSegura123"   
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

# ─────────────────────────────────────────────
# Node Exporter
# ─────────────────────────────────────────────
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# ─────────────────────────────────────────────
# Kube State Metrics
# ─────────────────────────────────────────────
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# ─────────────────────────────────────────────
# Prometheus Operator
# ─────────────────────────────────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Desactivar admission webhooks (ahorra un pod completo)
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# ─────────────────────────────────────────────
# Componentes que no usamos
# ─────────────────────────────────────────────
thanosRuler:
  enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeProxy: false
    kubeApiserverSlos: false