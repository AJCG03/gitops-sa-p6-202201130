    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 5
        batchwait: 1s
        batchsize: 1048576
        timeout: 10s

    scrape_configs:
      - job_name: sa-p6-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - sa-p6

        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: level
                service: service
                message: message
                timestamp: timestamp
                trace_id: trace_id
                span_id: span_id
                req_url: req.url
          - drop:
              source: req_url
              expression: "^/(health|ready|metrics|livez|readyz)$"
          - labels:
              level:
              service:
          - structured_metadata:
              trace_id:
              span_id:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
              fallback_formats:
                - RFC3339
                - UnixMs
          - output:
              source: message

        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: sa-p6
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - action: labeldrop
            regex: "pod|container|node|stream|filename|service_name"
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log