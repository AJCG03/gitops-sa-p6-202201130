# ═══════════════════════════════════════════════════════════════════
# Values para el chart oficial de Loki (grafana/loki) — CORREGIDO
# Modo singleBinary: 1 pod autónomo sin dependencias de red de clúster
# Optimizado para GKE (3Gi PVC, 384Mi RAM Limit)
# ═══════════════════════════════════════════════════════════════════

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
      instance_addr: 127.0.0.1

  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    retention_period: 24h
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_streams_per_user: 10000
    max_global_streams_per_user: 10000
    max_entries_limit_per_query: 5000
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    max_query_series: 500
    max_query_parallelism: 16

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 30m
    retention_delete_worker_count: 50

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: warn

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  extraArgs:
    - -target=all
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: "OnRootMismatch"
  readinessProbe:
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
ruler:
  enabled: false
  replicas: 0

chunksCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

resultsCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

promtail:
  enabled: false