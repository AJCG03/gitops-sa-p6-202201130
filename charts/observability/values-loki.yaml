loki:
  auth_enabled: false

  # ⬅️ FIX: ring inmemory con instance_port a 9095 (gRPC)
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
      instance_addr: 127.0.0.1
      instance_port: 9095          # ⬅️ CAMBIO: era 3100, ahora 9095

  ingester:
    chunk_idle_period: 5m
    chunk_target_size: 1048576
    max_chunk_age: 30m
    chunk_encoding: snappy

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    retention_period: 24h
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 5
    ingestion_burst_size_mb: 10
    max_streams_per_user: 10000
    max_global_streams_per_user: 5000
    max_entries_limit_per_query: 5000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 6MB
    max_query_series: 500
    max_query_parallelism: 16
    max_label_names_per_series: 15

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 30m
    retention_delete_worker_count: 50

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # ⬅️ FIX: server con puertos separados + límites gRPC
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: warn
    grpc_server_max_recv_msg_size: 104857600
    grpc_server_max_send_msg_size: 104857600
    grpc_server_max_concurrent_streams: 1000

  analytics:
    reporting_enabled: false