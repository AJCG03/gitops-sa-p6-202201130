deploymentMode: SingleBinary

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  config: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
        instance_addr: 127.0.0.1
        instance_port: 9095
    ingester:
      chunk_idle_period: 5m
      chunk_target_size: 1048576
      max_chunk_age: 30m
      chunk_encoding: snappy
      wal:
        enabled: true
        dir: /var/loki/wal
      lifecycler:
        address: 127.0.0.1
        port: 9095
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
        num_tokens: 512
        heartbeat_period: 5s
        join_after: 0s
        observe_period: 0s
        interface_names:
          - eth0
    ingester_client:
      grpc_client_config:
        max_recv_msg_size: 104857600
        max_send_msg_size: 104857600
      pool_config:
        health_check_ingesters: true
    distributor:
      ring:
        kvstore:
          store: inmemory
    ruler:
      ring:
        kvstore:
          store: inmemory
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: false
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 30m
      retention_delete_worker_count: 50
    limits_config:
      retention_period: 24h
      max_query_lookback: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 24h
      ingestion_rate_mb: 5
      ingestion_burst_size_mb: 10
      max_streams_per_user: 10000
      max_global_streams_per_user: 5000
      max_entries_limit_per_query: 5000
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 6MB
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /var/loki/chunks
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
    analytics:
      reporting_enabled: false

singleBinary:
  replicas: 1
  extraArgs:
    - -target=all
    - -query-scheduler.use-scheduler-ring=false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  nodeSelector: {}
  tolerations: []

# ⬅️ FIX: probes a NIVEL RAÍZ (no dentro de singleBinary)
readinessProbe:
  httpGet:
    path: /ready
    port: http-metrics
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /ready
    port: http-metrics
  initialDelaySeconds: 600
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6

# ⬅️ FIX: securityContext a nivel raíz
podSecurityContext:
  fsGroup: 0
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false    # ⬅️ CRÍTICO: false
  runAsNonRoot: false
  runAsUser: 0

# Deshabilitar componentes distribuidos
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
ruler: { enabled: false, replicas: 0 }
chunksCache: { enabled: false, replicas: 0, allocatedMemory: 0 }
resultsCache: { enabled: false, replicas: 0, allocatedMemory: 0 }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s
promtail: { enabled: false }