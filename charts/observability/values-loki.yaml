# ═══════════════════════════════════════════════════════════════════
# Values para Loki — SingleBinary, compatible con chart 6.x / Loki 3.x
# FIX P10: 
#   - Ring en inmemory (evita memberlist DNS)
#   - fsGroup a nivel raíz con OnRootMismatch
#   - Límites de streams aumentados
#   - Retención + compactor activos
# ═══════════════════════════════════════════════════════════════════

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  # ⬅️ FIX P10: ring inmemory, NO memberlist
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
      instance_addr: 127.0.0.1
      instance_port: 3100

  ingester:
    chunk_idle_period: 5m
    chunk_target_size: 1048576
    max_chunk_age: 30m
    chunk_encoding: snappy

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  # ⬅️ FIX P10: streams más altos + límites por stream
  limits_config:
    retention_period: 24h
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 5
    ingestion_burst_size_mb: 10
    max_streams_per_user: 5000
    max_global_streams_per_user: 5000
    max_entries_limit_per_query: 5000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 6MB
    max_query_series: 500
    max_query_parallelism: 16
    # ⬅️ NUEVO: reducir streams por label set
    max_label_names_per_series: 15
    max_streams_matrix_width: 5

  # ⬅️ FIX P10: compactor con retención activa
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 30m
    retention_delete_worker_count: 50

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: warn

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []

# ⬅️ FIX P10: fsGroup a NIVEL RAÍZ (así lo espera el chart)
#    Si el pod se queda en Pending procesando archivos, cambia temporalmente
#    fsGroup/runAsUser a 0, deja que arranque, limpia inodos, y regresa a 10001.
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

# Deshabilitar componentes distribuidos
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
ruler:
  enabled: false
  replicas: 0

# Deshabilitar caches (ahorra RAM)
chunksCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

resultsCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

promtail:
  enabled: false