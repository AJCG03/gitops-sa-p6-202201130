# ═══════════════════════════════════════════════════════════════════
# Values para el chart oficial de Loki (grafana/loki)
# Modo singleBinary: 1 pod que hace todo
# Optimizado para GKE con nodos e2-standard-2 (2 vCPU, 8 GB RAM)
# ═══════════════════════════════════════════════════════════════════

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    retention_period: 24h
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 5
    ingestion_burst_size_mb: 10
    max_streams_per_user: 2000
    max_entries_limit_per_query: 5000
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: warn
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  nodeSelector: {}
  tolerations: []

# Deshabilitar TODOS los componentes distribuidos
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
ruler:
  enabled: false
  replicas: 0

# ═══════════════════════════════════════════════════════════════════
#  CRÍTICO: DESACTIVAR LOS CACHES
#  Sin esto, Helm crea pods memcached con 10 GB de RAM que nunca
#  caben en nodos e2-standard-2 y quedan en Pending eternamente.
# ═══════════════════════════════════════════════════════════════════
chunksCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

resultsCache:
  enabled: false
  replicas: 0
  allocatedMemory: 0

# Deshabilitar otros componentes opcionales
lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

promtail:
  enabled: false