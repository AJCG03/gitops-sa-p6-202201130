deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    retention_period: 24h        # ← de 168h a 24h
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 5         # ← de 10 a 5
    ingestion_burst_size_mb: 10  # ← de 20 a 10
    max_streams_per_user: 2000   # ← de 5000 a 2000
    max_entries_limit_per_query: 5000  # ← de 10000 a 5000
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: warn
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 3Gi              # ← de 5Gi a 3Gi
    accessModes:
      - ReadWriteOnce
  nodeSelector: {}
  tolerations: []

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

lokiCanary:
  enabled: false

test:
  enabled: false

gateway:
  enabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

promtail:
  enabled: false