# ═══════════════════════════════════════════════════════════════════
# Referencia de configuración del OTel Collector
# NOTA: Este archivo NO se aplica. La configuración real está en
# otel-collector.yaml (ConfigMap). Este archivo es solo documentación.
# ═══════════════════════════════════════════════════════════════════

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 64
    send_batch_max_size: 128
    timeout: 5s
  resource:
    attributes:
      - key: cluster
        value: practica6-cluster
        action: upsert

exporters:
  # Métricas → Prometheus (scrapeado en :8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel

  # Trazas → Tempo
  otlp/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true

  # Logs → Loki
  loki:
    endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [loki]