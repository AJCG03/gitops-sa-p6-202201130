apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: datos-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: datos-service
    app.kubernetes.io/part-of: sa-platform
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: datos-service
  strategy:
    canary:
      stableService: datos-service-stable
      canaryService: datos-service-canary
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: smoke-datos-service
            args:
              - name: service-name
                value: datos-service-canary
        - setWeight: 50
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: load-datos-service
            args:
              - name: service-name
                value: datos-service-canary
        - setWeight: 80
        - pause:
            duration: 60s
        - setWeight: 100
  template:
    metadata:
      labels:
        app: datos-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: datos-service
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: datos-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3003
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: url
            - name: MONGODB_DB
              value: "DatosDB"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}