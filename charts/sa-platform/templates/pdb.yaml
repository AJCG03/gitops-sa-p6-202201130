{{- range $service := list "api-gateway" "auth-service" "sensores-service" "datos-service" "alertas-service" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $service }}-pdb
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $service }}
    app.kubernetes.io/part-of: sa-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $service }}
---
{{- end }}
