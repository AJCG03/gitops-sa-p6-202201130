apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-metrics
  namespace: {{ .Values.global.namespace }}
  labels:
    release: kube-prometheus-stack
    app: api-gateway
    app.kubernetes.io/part-of: sa-platform
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http-proxy
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s