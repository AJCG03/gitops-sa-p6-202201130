# ═══════════════════════════════════════════════════════════════════════════
# AnalysisTemplate: api-gateway
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-metrics-api-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/component: canary-analysis
    app: api-gateway
spec:
  args:
    - name: prometheus-address
      value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
  metrics:
    - name: error-rate
      interval: 30s
      count: 5
      successCondition: "len(result) > 0 && result[0] < 0.001"
      failureLimit: 2
      provider:
        prometheus:
          address: "{{ `{{args.prometheus-address}}` }}"
          query: |
            sum(
              rate(http_server_request_duration_seconds_count{
                job=~".*api-gateway.*",
                status_code=~"5.."
              }[2m])
            )
            /
            sum(
              rate(http_server_request_duration_seconds_count{
                job=~".*api-gateway.*"
              }[2m])
            )
            or vector(0)
    - name: p99-latency
      interval: 30s
      count: 5
      successCondition: "len(result) > 0 && result[0] < 0.200"
      failureLimit: 2
      provider:
        prometheus:
          address: "{{ `{{args.prometheus-address}}` }}"
          query: |
            histogram_quantile(
              0.99,
              sum(
                rate(http_server_request_duration_seconds_bucket{
                  job=~".*api-gateway.*"
                }[2m])
              ) by (le)
            )
            or vector(0)
---
