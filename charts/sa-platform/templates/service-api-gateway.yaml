# ═══════════════════════════════════════════════════════════════
# Service: api-gateway-stable (tráfico de usuarios)
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: stable
spec:
  type: ClusterIP
  ports:
    - name: http-proxy
      port: 80
      targetPort: 8080
  selector:
    app: api-gateway
---
# ═══════════════════════════════════════════════════════════════
# Service: api-gateway-canary (tráfico de prueba)
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
    role: canary
spec:
  type: ClusterIP
  ports:
    - name: http-proxy
      port: 80
      targetPort: 8080
  selector:
    app: api-gateway
---
# ═══════════════════════════════════════════════════════════════
# Service: api-gateway (principal - usado por el ServiceMonitor)
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http-proxy
      port: 8080
      targetPort: 8080
    - name: http-nginx
      port: 8081
      targetPort: 8081
  selector:
    app: api-gateway