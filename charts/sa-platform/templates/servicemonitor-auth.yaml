apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service-metrics
  namespace: {{ .Values.global.namespace }}
  labels:
    release: kube-prometheus-stack
    app: auth-service
    app.kubernetes.io/part-of: sa-platform
spec:
  selector:
    matchLabels:
      app: auth-service
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s