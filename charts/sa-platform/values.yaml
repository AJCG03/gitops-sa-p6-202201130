# ============================================
# CONFIGURACIÓN GLOBAL
# ============================================
global:
  namespace: "sa-p6"
  logLevel: "info"
  environment: "base"

# ============================================
# API GATEWAY
# ============================================
api_gateway:
  replicaCount: 1                    # ← de 2 a 1
  image:
    repository: "ghcr.io/ajcg03/api-gateway"
    tag: "v1.0.0"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP                  # ← de LoadBalancer a ClusterIP (ahorra $ y un balanceador)
  resources:
    limits:
      cpu: "200m"                    # ← de 300m a 200m
      memory: "256Mi"                # ← de 384Mi a 256Mi
    requests:
      cpu: "50m"                     # ← de 100m a 50m
      memory: "64Mi"                 # ← de 128Mi a 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# ============================================
# API GATEWAY PROXY (sidecar OTel)
# ============================================
api_gateway_proxy:
  image:
    repository: "ghcr.io/ajcg03/api-gateway-proxy"
    tag: "v1.0.0"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: "150m"
      memory: "192Mi"
    requests:
      cpu: "50m"      # ← Corregido de 30m a 50m (mínimo del clúster)
      memory: "64Mi"    # ← Corregido de 48Mi a 64Mi (mínimo del clúster)
  env:
    PORT: "8080"
    NGINX_UPSTREAM_URL: "http://localhost:8081"
    OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
    OTEL_SERVICE_NAME: "api-gateway"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
# ============================================
# AUTH SERVICE
# ============================================
auth_service:
  replicaCount: 1                    # ← de 2 a 1
  image:
    repository: "ghcr.io/ajcg03/auth-service"
    tag: "v1.0.0"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: "200m"                    # ← de 300m a 200m
      memory: "256Mi"                # ← de 384Mi a 256Mi
    requests:
      cpu: "50m"                     # ← de 100m a 50m
      memory: "64Mi"                 # ← de 128Mi a 64Mi
  hpa:
    enabled: false                   # ← DESACTIVADO (con 1 réplica no aplica)
    minReplicas: 1
    maxReplicas: 2
    cpuThreshold: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

