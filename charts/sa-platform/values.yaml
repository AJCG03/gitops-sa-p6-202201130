# ============================================
# ROLLOUT — CONFIGURACIÓN CANARY
# ============================================
rollout:
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 30s              # ← de 60s a 30s
      - analysis:
          templateName: canary-metrics
      - setWeight: 50
      - pause:
          duration: 30s              # ← de 60s a 30s
      - analysis:
          templateName: canary-metrics
      - setWeight: 80
      - pause:
          duration: 30s              # ← de 60s a 30s
      - setWeight: 100

# ============================================
# RABBITMQ (dependencia)
# ============================================
rabbitmq:
  enabled: false                     # ← DESACTIVADO si no lo usas (ahorra un pod)
  # ... (el resto igual si algún día lo activas)

# ============================================
# DESHABILITAR BASES INTERNAS
# ============================================
mongodb:
  enabled: false
mysql:
  enabled: false