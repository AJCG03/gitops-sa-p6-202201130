# ============================================
# ROLLOUT — CONFIGURACIÓN CANARY GLOBAL
# ============================================
rollout:
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 60s
      - analysis:
          templateName: smoke-analysis
      - setWeight: 50
      - pause:
          duration: 60s
      - analysis:
          templateName: load-analysis
      - setWeight: 80
      - pause:
          duration: 60s
      - setWeight: 100

# ============================================
# RABBITMQ (dependencia)
# ============================================
rabbitmq:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 3.12.13-debian-12-r0
    pullPolicy: IfNotPresent
  auth:
    username: "app_user"
    existingSecret: "rabbitmq-credentials"
  persistence:
    enabled: false
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
  metrics:
    enabled: false
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

# ============================================
# DESHABILITAR BASES INTERNAS
# ============================================
mongodb:
  enabled: false
mysql:
  enabled: false