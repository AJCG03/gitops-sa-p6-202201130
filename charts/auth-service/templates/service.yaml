# Service estable (recibe tráfico de usuarios)
apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
    role: stable
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: auth-service
---
# Service canary (recibe tráfico de prueba)
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
    role: canary
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: auth-service
---
# Service principal (compatibilidad)
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: auth-service